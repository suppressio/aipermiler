version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      minori-e-patch:
        update-types: ["minor", "patch"]
    # Major bumps (Electron, electron-store, eslint…) need coordinated changes:
    # they get a dedicated issue, not a one-package PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Actions are pinned to major tags (v4…): a major bump is the normal update,
  # so majors are not ignored here; minor/patch of full-version pins are grouped.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      minori-e-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/gocore"
    target-branch: "next"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      minori-e-patch:
        update-types: ["minor", "patch"]
